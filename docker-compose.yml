services:
  documind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-rag
    ports:
      - "8000:8000"
    volumes:
      # Persistent vector store, uploaded documents, and saved API keys
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
    restart: unless-stopped
